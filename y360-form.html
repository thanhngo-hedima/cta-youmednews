<script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbw_Xhm6Pmk913sUHLmwCKT1GAsyoSc8iriXyQpXKuExwZsQxW1CHh--TbERDmDPUV71/exec';
    const form = document.getElementById('leadForm');

    // Cố gắng lấy UTM từ trang cha, nếu bị chặn thì bỏ qua để tránh lỗi script
    try {
        const urlParams = new URLSearchParams(window.top.location.search);
        document.getElementById('utm_source').value = urlParams.get('utm_source') || '';
        document.getElementById('utm_medium').value = urlParams.get('utm_medium') || '';
        document.getElementById('utm_campaign').value = urlParams.get('utm_campaign') || '';
    } catch (e) {
        console.warn("Không thể lấy UTM từ trang cha do chính sách bảo mật trình duyệt.");
    }

    form.addEventListener('submit', e => {
        e.preventDefault();
        const submitBtn = document.getElementById('submitBtn');
        submitBtn.disabled = true;
        submitBtn.innerText = 'Đang gửi...';

        // Sử dụng FormData để lấy toàn bộ dữ liệu form
        const formData = new FormData(form);

        fetch(scriptURL, { 
            method: 'POST', 
            mode: 'no-cors', // Thêm dòng này để vượt qua lỗi CORS khi dùng iframe
            body: formData
        })
        .then(() => {
            // Lưu ý: khi dùng mode 'no-cors', response trả về sẽ rỗng
            // nên chúng ta mặc định là thành công.
            document.getElementById('msg').style.display = 'block';
            form.reset();
            submitBtn.style.display = 'none';
        })
        .catch(error => {
            console.error('Error!', error.message);
            submitBtn.disabled = false;
            submitBtn.innerText = 'Gửi lại';
            alert('Có lỗi xảy ra, vui lòng thử lại!');
        });
    });
</script>
